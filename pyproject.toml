[project]
name = "object-detection"
version = "0.1.0"
description = "作业二：建筑裂缝目标检测多架构对比训练与评测（YOLO 系 / Faster R-CNN / RetinaNet / RT-DETR）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pycocotools>=2.0.11",
    "thop>=0.1.1.post2209072238",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.172",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.uv]
package = false
python-preference = "system"

[tool.ruff]
line-length = 120
